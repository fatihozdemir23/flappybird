<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Flappy Dash Mobile</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            touch-action: manipulation;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            width: 100vw;
            height: 100vh;
            object-fit: contain;
            background: #70c5ce;
            image-rendering: pixelated;
        }
    </style>
</head>
<body>
    <canvas id="game"></canvas>
    <script>
        const canvas = document.getElementById('game');
        // Alpha kanalını kapatmak mobil çizim performansını artırır
        const ctx = canvas.getContext('2d', { alpha: false });

        // Dahili render çözünürlüğünü mobilde sabit tutuyoruz (360x640)
        canvas.width = 360;
        canvas.height = 640;

        let lastTime = performance.now();
        let score = 0;
        let gameOver = false;

        const bird = { x: 80, y: 300, vy: 0, gravity: 1100, jump: -360, radius: 12 };
        const pipes = [];
        let pipeTimer = 0;

        function resetGame() {
            bird.y = 300;
            bird.vy = 0;
            pipes.length = 0;
            score = 0;
            gameOver = false;
            lastTime = performance.now();
        }

        function jump(e) {
            if (e) e.preventDefault();
            if (gameOver) {
                resetGame();
                return;
            }
            bird.vy = bird.jump;
        }

        // Dokunma gecikmesini engelleyen pasif olmayan dinleyici
        window.addEventListener('touchstart', jump, { passive: false });
        window.addEventListener('mousedown', jump);
        window.addEventListener('keydown', (e) => { if (e.code === 'Space') jump(e); });

        function update(dt) {
            if (gameOver) return;

            bird.vy += bird.gravity * dt;
            bird.y += bird.vy * dt;

            if (bird.y + bird.radius > canvas.height || bird.y - bird.radius < 0) {
                gameOver = true;
            }

            pipeTimer += dt;
            if (pipeTimer > 1.4) {
                pipeTimer = 0;
                const gap = 135;
                const topH = 60 + Math.random() * (canvas.height - gap - 160);
                pipes.push({ x: canvas.width, top: topH, bottom: canvas.height - topH - gap, passed: false });
            }

            for (let i = pipes.length - 1; i >= 0; i--) {
                const p = pipes[i];
                p.x -= 170 * dt;

                // Basit ve hızlı çarpışma hesabı
                if (bird.x + bird.radius > p.x && bird.x - bird.radius < p.x + 52) {
                    if (bird.y - bird.radius < p.top || bird.y + bird.radius > canvas.height - p.bottom) {
                        gameOver = true;
                    }
                }

                if (!p.passed && p.x + 52 < bird.x) {
                    p.passed = true;
                    score++;
                }

                if (p.x < -60) pipes.splice(i, 1);
            }
        }

        function draw() {
            // Arka plan
            ctx.fillStyle = '#70c5ce';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Engeller
            ctx.fillStyle = '#2ecc71';
            for (let i = 0; i < pipes.length; i++) {
                const p = pipes[i];
                ctx.fillRect(p.x, 0, 52, p.top);
                ctx.fillRect(p.x, canvas.height - p.bottom, 52, p.bottom);
            }

            // Kuş
            ctx.fillStyle = '#f1c40f';
            ctx.beginPath();
            ctx.arc(bird.x, bird.y, bird.radius, 0, Math.PI * 2);
            ctx.fill();

            // Skor
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 28px sans-serif';
            ctx.fillText(score, canvas.width / 2 - 10, 60);

            if (gameOver) {
                ctx.fillStyle = 'rgba(0,0,0,0.6)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 22px sans-serif';
                ctx.fillText('OYUN BİTTİ', 115, 300);
                ctx.font = '14px sans-serif';
                ctx.fillText('Tekrar oynamak için dokunun', 85, 335);
            }
        }

        function loop(now) {
            // Geçen süreyi (dt) hesaplayarak kare hızı takılmalarını önler
            const dt = Math.min((now - lastTime) / 1000, 0.1);
            lastTime = now;

            update(dt);
            draw();
            requestAnimationFrame(loop);
        }

        requestAnimationFrame(loop);
    </script>
</body>
</html>
